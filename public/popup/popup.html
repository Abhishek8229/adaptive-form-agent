<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adaptive Form Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Adaptive Form Agent</h1>
      <p class="subtitle">Structured form view (no AI yet)</p>
    </header>

    <section class="actions">
      <button id="scan-btn" type="button">Scan current page</button>
    </section>

    <section class="status">
      <div id="status">Idle</div>
    </section>

    <section class="summary">
      <div class="row"><span class="label">Forms:</span><span id="form-count">0</span></div>
      <div class="row"><span class="label">Fields:</span><span id="count">0</span></div>
      <div class="row"><span class="label">URL:</span><span id="url" class="ellipsis"></span></div>
      <div class="row"><span class="label">Detected:</span><span id="detected-at">-</span></div>
    </section>

    <section class="legend">
      <h2>Counts by control type</h2>
      <ul id="type-list"></ul>
    </section>

    <section class="forms">
      <h2>Forms detected</h2>
      <div id="forms-container" class="forms-list"></div>
    </section>

    <section class="persona">
      <h2>Persona</h2>
      <div class="persona-actions">
        <button id="persona-reload-btn" type="button">Reload</button>
        <button id="persona-examples-btn" type="button">Load examples</button>
        <button id="persona-clear-btn" type="button" class="danger">Clear all</button>
      </div>
      <div id="persona-status" class="persona-status"></div>

      <div class="persona-section">
        <h3>Identity</h3>
        <div id="persona-identity" class="persona-identity"></div>
      </div>

      <div class="persona-section">
        <h3>Facts</h3>
        <div class="persona-add">
          <input id="fact-id" type="text" placeholder="id (e.g. fact.electronics.smartphone)" />
          <input id="fact-category" type="text" placeholder="category" />
          <input id="fact-subject" type="text" placeholder="subject" />
          <input id="fact-predicate" type="text" placeholder="predicate" />
          <select id="fact-status">
            <option value="true">true</option>
            <option value="false">false</option>
            <option value="unknown">unknown</option>
          </select>
          <button id="fact-add-btn" type="button">Add fact</button>
        </div>
        <ul id="persona-facts" class="persona-list"></ul>
      </div>

      <div class="persona-section">
        <h3>Plans</h3>
        <div class="persona-add">
          <input id="plan-id" type="text" placeholder="id (e.g. plan.computing.pc.buy)" />
          <input id="plan-category" type="text" placeholder="category" />
          <input id="plan-subject" type="text" placeholder="subject" />
          <input id="plan-predicate" type="text" placeholder="predicate" />
          <select id="plan-status">
            <option value="active">active</option>
            <option value="completed">completed</option>
            <option value="abandoned">abandoned</option>
            <option value="unknown">unknown</option>
          </select>
          <select id="plan-horizon">
            <option value="immediate">immediate</option>
            <option value="short-term">short-term</option>
            <option value="medium-term" selected>medium-term</option>
            <option value="long-term">long-term</option>
            <option value="no-longer">no-longer</option>
          </select>
          <button id="plan-add-btn" type="button">Add plan</button>
        </div>
        <ul id="persona-plans" class="persona-list"></ul>
      </div>

      <div class="persona-section">
        <h3>Preferences</h3>
        <ul id="persona-preferences" class="persona-list"></ul>
      </div>

      <div class="persona-section">
        <h3>Experiences</h3>
        <ul id="persona-experiences" class="persona-list"></ul>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
