<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adaptive Form Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Adaptive Form Agent</h1>
      <p class="subtitle">JSON profile form filler</p>
    </header>

    <section class="actions">
      <button id="scan-btn" type="button">Scan current page</button>
    </section>

    <section class="status">
      <div id="status">Idle</div>
    </section>

    <section class="summary">
      <div class="row"><span class="label">Forms:</span><span id="form-count">0</span></div>
      <div class="row"><span class="label">Fields:</span><span id="count">0</span></div>
      <div class="row"><span class="label">URL:</span><span id="url" class="ellipsis"></span></div>
      <div class="row"><span class="label">Detected:</span><span id="detected-at">-</span></div>
    </section>

    <section class="legend">
      <h2>Counts by control type</h2>
      <ul id="type-list"></ul>
    </section>

    <section class="forms">
      <h2>Forms detected</h2>
      <div id="forms-container" class="forms-list"></div>
    </section>

    <section class="profiles">
      <h2>JSON profile</h2>
      <div class="profile-row">
        <label for="profile-select" class="label">Profile:</label>
        <select id="profile-select"></select>
        <button id="profile-reload-btn" type="button" class="secondary">Reload</button>
      </div>
      <div class="profile-status" id="profile-status">Loading profiles...</div>
      <div class="profile-actions">
        <label class="file-button">
          <input id="profile-file-input" type="file" accept="application/json,.json" hidden />
          <span>Load JSON file</span>
        </label>
        <button id="profile-save-btn" type="button" class="secondary">Save current</button>
        <button id="profile-delete-btn" type="button" class="danger">Delete</button>
      </div>
    </section>

    <section class="bot">
      <h2>Bot</h2>
      <div class="bot-actions">
        <button id="bot-start-btn" type="button" class="primary">START BOT</button>
        <button id="bot-stop-btn" type="button" class="danger" disabled>STOP BOT</button>
      </div>
      <div class="bot-status" id="bot-status">Idle.</div>
      <div class="bot-row"><span class="label">Current field:</span><span id="bot-current">-</span></div>
      <div class="bot-row"><span class="label">Reason:</span><span id="bot-reason">-</span></div>
      <div class="bot-row counters">
        <span><span class="label">Completed:</span> <span id="bot-completed">0</span></span>
        <span><span class="label">Skipped:</span> <span id="bot-skipped">0</span></span>
        <span><span class="label">Failed:</span> <span id="bot-failed">0</span></span>
        <span><span class="label">Total:</span> <span id="bot-total">0</span></span>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
